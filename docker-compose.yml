services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-edu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edu}
      POSTGRES_DB: ${DB_NAME:-edu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edu} -d ${DB_NAME:-edu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-edu}
      DB_PASSWORD: ${DB_PASSWORD:-edu}
      DB_NAME: ${DB_NAME:-edu}
      DB_SYNC: ${DB_SYNC:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

volumes:
  postgres_data:
